<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Głosowanie SU - z blokadą urządzenia</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; --warning: #f39c12; --light: #ecf0f1; --dark: #2c3e50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #4a6491 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #eee; }
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 2em; }
        .subtitle { color: #666; font-size: 1.1em; }
        .current-badge { display: inline-block; background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-top: 10px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .voting-card { background: #f8f9fa; border-radius: 10px; padding: 25px; margin-bottom: 25px; border-left: 5px solid var(--secondary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .voting-title { color: var(--primary); font-size: 1.3em; margin-bottom: 10px; }
        .voting-desc { color: #555; margin-bottom: 20px; line-height: 1.6; }
        .vote-options { display: flex; gap: 15px; margin: 25px 0; flex-wrap: wrap; }
        .vote-btn { flex: 1; min-width: 120px; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .vote-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .vote-yes { background: var(--success); color: white; }
        .vote-no { background: var(--danger); color: white; }
        .vote-abstain { background: var(--warning); color: white; }
        .vote-btn:hover:not(:disabled) { transform: scale(1.05); opacity: 0.9; }
        .voter-info { background: white; padding: 20px; border-radius: 8px; border: 2px solid #eee; margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"] { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        input[type="text"]:focus { border-color: var(--secondary); outline: none; }
        .admin-link { position: fixed; top: 20px; right: 20px; background: var(--primary); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 100; }
        .admin-link:hover { background: #1a252f; }
        footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #666; font-size: 0.9em; }
        .message { padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center; display: none; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .no-voting { text-align: center; padding: 50px; color: #666; font-size: 1.2em; }
        .no-voting i { font-size: 3em; margin-bottom: 20px; color: #95a5a6; }
        .vote-counter { text-align: center; margin-top: 20px; color: #7f8c8d; font-size: 0.9em; }
        .info-box { background: #e8f4fd; border-left: 5px solid #3498db; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .results-box { background: #f1f9f1; border-left: 5px solid #27ae60; padding: 20px; border-radius: 8px; margin: 20px 0; }
        @media (max-width: 768px) { .container { padding: 15px; } .vote-options { flex-direction: column; } .vote-btn { width: 100%; } .admin-link { position: static; display: block; text-align: center; margin-bottom: 20px; } }
    </style>
</head>
<body>
    <a href="admin.html" class="admin-link">🔐 Admin</a>
    <div class="container">
        <header>
            <h1>🗳️ System Głosowań Samorządu Uczniowskiego</h1>
            <p class="subtitle">Zespół Szkół Technicznych w Mielcu</p>
            <div class="current-badge">AKTUALNE GŁOSOWANIE</div>
        </header>
        <main>
            <div id="loading" style="text-align: center; padding: 40px;">Ładowanie...</div>
            <div id="noVoting" class="no-voting" style="display: none;">
                <i class="fas fa-box-open"></i>
                <h3>Brak aktywnego głosowania</h3>
                <div class="info-box"><p>Obecnie nie ma żadnego aktywnego głosowania.</p><p>Oczekuj na instrukcje przewodniczącego.</p></div>
            </div>
            <div id="votingContainer"></div>
            <div class="vote-counter" id="voteCounter"></div>
        </main>
        <footer><p>© 2025 System Głosowania SU</p></footer>
    </div>

    <!-- FingerprintJS (do identyfikacji urządzenia) -->
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        /* ========== TU WPISZ SWÓJ firebaseConfig ========== */
        const firebaseConfig = {
            apiKey: "AIzaSyCZx26yk4sxdAKewKSyuGzCEWTOU8n4zcM",
  authDomain: "szkolne-glosowanie.firebaseapp.com",
  projectId: "szkolne-glosowanie",
  storageBucket: "szkolne-glosowanie.firebasestorage.app",
  messagingSenderId: "700574499107",
  appId: "1:700574499107:web:b96aafa286252370cccc96"
        };
        /* ================================================= */

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentVoting = null;
        let deviceFingerprint = null;      // przechowa identyfikator urządzenia
        let fingerprintReady = false;

        // Generuj fingerprint przy starcie
        const fpPromise = FingerprintJS.load();
        fpPromise.then(fp => fp.get()).then(result => {
            deviceFingerprint = result.visitorId;
            fingerprintReady = true;
            console.log("Fingerprint urządzenia:", deviceFingerprint);
            // Po uzyskaniu fingerprintu – odśwież widok (może być już załadowany)
            if (currentVoting) {
                renderVoting(currentVoting);
            }
        });

        async function loadCurrentVoting() {
            const loading = document.getElementById('loading');
            const noVotingDiv = document.getElementById('noVoting');
            const container = document.getElementById('votingContainer');
            try {
                const q = query(collection(db, "votings"), where("visible", "==", true), where("status", "==", "active"));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    loading.style.display = 'none';
                    noVotingDiv.style.display = 'block';
                    container.innerHTML = '';
                    return;
                }
                const docSnap = querySnapshot.docs[0];
                currentVoting = { id: docSnap.id, ...docSnap.data() };
                loading.style.display = 'none';
                noVotingDiv.style.display = 'none';
                if (fingerprintReady) {
                    renderVoting(currentVoting);
                } else {
                    // jeśli fingerprint jeszcze nie gotowy, pokaż komunikat ładowania
                    container.innerHTML = '<div class="info-box">Ładowanie identyfikatora urządzenia...</div>';
                }
                updateVoteCounter(currentVoting.id);
                if (currentVoting.resultsVisible) {
                    showResults(currentVoting.id);
                }
            } catch (err) {
                console.error(err);
                loading.innerHTML = 'Błąd ładowania. Odśwież stronę.';
            }
        }

        async function renderVoting(voting) {
            const container = document.getElementById('votingContainer');
            const lastVoter = localStorage.getItem('lastVoterName') || '';
            
            // Sprawdź blokady: po nazwie i po fingerprint
            const hasVotedByName = await checkIfVotedByName(voting.id, lastVoter);
            const hasVotedByDevice = await checkIfVotedByDevice(voting.id, deviceFingerprint);
            const hasVoted = hasVotedByName || hasVotedByDevice;
            
            let blockMessage = '';
            if (hasVotedByDevice && !hasVotedByName) {
                blockMessage = '<div class="message error">⚠️ Z tego urządzenia oddano już głos (wcześniej pod inną nazwą). Możesz głosować tylko raz.</div>';
            } else if (hasVotedByName) {
                blockMessage = '<div class="message success">✅ Już oddałeś głos w tym głosowaniu (jako ' + escapeHtml(lastVoter) + ').</div>';
            }
            
            container.innerHTML = `
                <div class="voting-card">
                    <div class="voting-title">${escapeHtml(voting.title)}</div>
                    <div class="voting-desc">${escapeHtml(voting.description)}</div>
                    <div class="voter-info">
                        <div class="form-group">
                            <label>👤 Imię i Nazwisko (wymagane):</label>
                            <input type="text" id="voterName" placeholder="np. Jan Kowalski" value="${escapeHtml(lastVoter)}">
                        </div>
                        ${blockMessage}
                        ${!hasVoted ? `
                            <div class="vote-options">
                                <button class="vote-btn vote-yes" onclick="vote('yes')">👍 ZA</button>
                                <button class="vote-btn vote-no" onclick="vote('no')">👎 PRZECIW</button>
                                <button class="vote-btn vote-abstain" onclick="vote('abstain')">🤝 WSTRZYMUJĘ SIĘ</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div id="resultsContainer"></div>
            `;
        }

        // Sprawdzenie po nazwie
        async function checkIfVotedByName(votingId, voterName) {
            if (!voterName) return false;
            const voteRef = doc(db, "voteDetails", votingId, "votes", voterName);
            const snap = await getDoc(voteRef);
            return snap.exists();
        }

        // Sprawdzenie po fingerprint (urządzeniu)
        async function checkIfVotedByDevice(votingId, fingerprint) {
            if (!fingerprint) return false;
            const deviceRef = doc(db, "voteDetails", votingId, "deviceFingerprints", fingerprint);
            const snap = await getDoc(deviceRef);
            return snap.exists();
        }

        // Głosowanie
        window.vote = async function(voteType) {
            if (!fingerprintReady) {
                alert('Jeszcze trwa identyfikacja urządzenia. Spróbuj za chwilę.');
                return;
            }
            const voterName = document.getElementById('voterName').value.trim();
            if (!voterName) {
                alert('Podaj imię i nazwisko.');
                return;
            }
            if (!currentVoting) return;
            
            // Podwójne sprawdzenie (na wypadek, gdyby ktoś ominął front)
            const alreadyByName = await checkIfVotedByName(currentVoting.id, voterName);
            const alreadyByDevice = await checkIfVotedByDevice(currentVoting.id, deviceFingerprint);
            if (alreadyByName || alreadyByDevice) {
                alert('Nie możesz głosować – Twój głos (lub urządzenie) już został zarejestrowany.');
                location.reload();
                return;
            }

            try {
                // 1. Zapis głosu w subkolekcji votes (pod nazwą)
                const voteRef = doc(db, "voteDetails", currentVoting.id, "votes", voterName);
                await setDoc(voteRef, {
                    voterName: voterName,
                    voteType: voteType,
                    timestamp: new Date().toISOString(),
                    deviceFingerprint: deviceFingerprint   // dodatkowo zapisujemy fingerprint przy głosie (dla ewidencji)
                });
                
                // 2. Zapis fingerprintu w osobnej subkolekcji (blokada urządzenia)
                const deviceRef = doc(db, "voteDetails", currentVoting.id, "deviceFingerprints", deviceFingerprint);
                await setDoc(deviceRef, {
                    fingerprint: deviceFingerprint,
                    votedAs: voterName,
                    timestamp: new Date().toISOString()
                });
                
                // 3. Zwiększenie liczników w głosowaniu
                const votingRef = doc(db, "votings", currentVoting.id);
                await updateDoc(votingRef, {
                    [`votes.${voteType}`]: increment(1)
                });
                
                localStorage.setItem('lastVoterName', voterName);
                alert('Głos oddany! Dziękujemy.');
                location.reload(); // odśwież, aby pokazać blokadę
            } catch (err) {
                console.error(err);
                alert('Błąd zapisu: ' + err.message);
            }
        };

        async function updateVoteCounter(votingId) {
            const votingRef = doc(db, "votings", votingId);
            const snap = await getDoc(votingRef);
            if (snap.exists()) {
                const v = snap.data().votes || { yes:0, no:0, abstain:0 };
                const total = v.yes + v.no + v.abstain;
                document.getElementById('voteCounter').innerHTML = `Głosów oddano: ${total}`;
            }
        }

        async function showResults(votingId) {
            const votingRef = doc(db, "votings", votingId);
            const snap = await getDoc(votingRef);
            if (snap.exists()) {
                const v = snap.data().votes || { yes:0, no:0, abstain:0 };
                const container = document.getElementById('resultsContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="results-box">
                            <h3>📊 Aktualne wyniki</h3>
                            <p>✅ ZA: ${v.yes}</p>
                            <p>❌ PRZECIW: ${v.no}</p>
                            <p>🤝 WSTRZYMUJĄCY SIĘ: ${v.abstain}</p>
                        </div>
                    `;
                }
            }
        }

        function escapeHtml(str) { 
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m){
                if(m==='&') return '&amp;';
                if(m==='<') return '&lt;';
                if(m==='>') return '&gt;';
                return m;
            });
        }

        // Uruchom
        loadCurrentVoting();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
